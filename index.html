<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隠語クイズ</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<!-- アナウンスバナー（管理者がリアルタイム配信） -->
<div id="ann-banner">
  <span class="ann-icon">📢</span>
  <span class="ann-msg" id="ann-msg"></span>
  <button class="ann-close" onclick="dismissAnn()" title="閉じる">✕</button>
</div>

<div class="hdr">
  <h1 onclick="titleClick()" onmousedown="holdStart()" onmouseup="holdEnd()" ontouchstart="holdStart();event.preventDefault()" ontouchend="holdEnd()">🔐 隠語クイズ</h1>
  <p id="flavor-p" onclick="subClick()" style="cursor:pointer">友達だけの秘密言語</p>
</div>
<div class="card" id="card" onclick="cardCornerTap(event)"></div>

<!-- 確認モーダル -->
<div id="modal" class="modal-ov" style="display:none" onclick="closeModal()">
  <div class="modal-box" onclick="event.stopPropagation()">
    <div class="modal-icon" id="modal-icon">❓</div>
    <div class="modal-q">本当に？</div>
    <div class="modal-msg" id="modal-msg"></div>
    <button class="modal-yes" id="modal-yes">はい</button>
    <button class="modal-no" onclick="closeModal()">やっぱやめる</button>
  </div>
</div>

<script src="js/script.js"></script>
</body>
</html>

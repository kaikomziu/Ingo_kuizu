<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>隠語クイズ</title>
  <style>
    :root {
      --ac:#e94560; --ac-dk:#c73652; --ac-glow:rgba(233,69,96,.53); --ac-ghost:rgba(233,69,96,.08);
      --bg:#1a1a2e; --card:#16213e; --card2:#0f3460; --card3:#1a4a80; --txt:#eee; --txt2:#888;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: var(--bg); color: var(--txt);
      min-height: 100vh;
      display: flex; flex-direction: column; align-items: center;
      padding: 16px 14px 48px;
    }
    .hdr { text-align: center; margin: 10px 0 18px; }
    .hdr h1 { font-size: 1.9rem; color: var(--ac); text-shadow: 0 0 18px var(--ac-glow); cursor: pointer; user-select: none; }
    .hdr h1:active { transform: scale(.95); }
    .hdr p { font-size: 0.75rem; color: #555; margin-top: 3px; transition: color .3s; }
    .card {
      background: var(--card); border-radius: 20px;
      padding: 22px 20px; max-width: 520px; width: 100%;
      box-shadow: 0 8px 40px #00000099;
    }

    /* ── Buttons ── */
    .btn {
      display: block; width: 100%; padding: 12px;
      background: var(--ac); color: #fff; border: none;
      border-radius: 12px; font-size: 0.95rem; font-weight: 600;
      cursor: pointer; transition: all .15s; margin-top: 9px;
    }
    .btn:hover:not(:disabled) { background: var(--ac-dk); transform: translateY(-1px); }
    .btn:active:not(:disabled) { transform: translateY(0); }
    .btn:disabled { background: #2a2a3a; color: #555; cursor: default; }
    .btn.sec { background: var(--card2); }
    .btn.sec:hover:not(:disabled) { background: var(--card3); }
    .btn.out { background: transparent; border: 2px solid var(--ac); color: var(--ac); }
    .btn.out:hover:not(:disabled) { background: var(--ac-ghost); }
    .btn.danger { background: #7f1d1d; }
    .btn.danger:hover:not(:disabled) { background: #9f2d2d; }
    .btn-row { display: flex; gap: 8px; margin-top: 9px; }
    .btn-row .btn { margin-top: 0; }

    /* ── Input ── */
    .inp-g { margin-bottom: 14px; }
    .inp-g label { display: block; font-size: 0.78rem; color: #666; margin-bottom: 5px; }
    .inp-g input {
      width: 100%; padding: 10px 12px;
      background: var(--card2); border: 2px solid var(--card3);
      border-radius: 10px; color: var(--txt); font-size: 0.95rem; outline: none;
      transition: border-color .15s;
    }
    .inp-g input:focus { border-color: var(--ac); }

    /* ── Rank bar ── */
    .rank-bar { background: var(--card2); border-radius: 12px; padding: 11px 13px; margin-bottom: 12px; }
    .rank-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; }
    .rank-name { font-weight: bold; font-size: 0.9rem; }
    .rank-total { font-size: 0.75rem; color: var(--txt2); }
    .rank-track { background: var(--bg); border-radius: 20px; height: 6px; overflow: hidden; }
    .rank-fill { height: 100%; border-radius: 20px; background: linear-gradient(90deg,var(--ac),#ff6b8a); transition: width .5s; }
    .rank-next { font-size: 0.7rem; color: #555; margin-top: 4px; text-align: right; }

    /* ── Mode grid ── */
    .mode-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 12px 0; }
    .mode-card {
      padding: 12px 6px; background: var(--card2);
      border: 2px solid transparent; border-radius: 13px;
      cursor: pointer; text-align: center; transition: all .15s;
    }
    .mode-card:hover, .mode-card.on { border-color: var(--ac); background: var(--card3); }
    .mode-card .mi { font-size: 1.35rem; margin-bottom: 3px; }
    .mode-card .mn { font-size: 0.8rem; font-weight: bold; }
    .mode-card .md { font-size: 0.62rem; color: var(--txt2); margin-top: 2px; line-height: 1.3; }

    /* ── Mode desc box ── */
    .mode-desc { background: var(--card2); border-radius: 11px; padding: 11px 13px; margin: 4px 0 10px; font-size: 0.82rem; color: var(--txt2); text-align: center; line-height: 1.5; }

    /* ── Num select ── */
    .num-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 12px; }
    .num-btn {
      flex: 1; min-width: 50px; padding: 9px 5px;
      background: var(--card2); border: 2px solid transparent;
      border-radius: 9px; color: var(--txt); font-size: 0.82rem;
      cursor: pointer; transition: all .15s; text-align: center; line-height: 1.3;
    }
    .num-btn:hover, .num-btn.on { border-color: var(--ac); background: var(--ac-ghost); color: #fff; }

    /* ── Nav ── */
    .nav-row { display: flex; gap: 8px; margin-top: 12px; }
    .nav-btn {
      flex: 1; padding: 11px 6px; background: var(--card2); border: none;
      border-radius: 11px; color: var(--txt); font-size: 0.85rem;
      cursor: pointer; transition: background .15s; text-align: center;
    }
    .nav-btn:hover { background: var(--card3); }
    .back { background: none; border: none; color: #666; font-size: 0.82rem; cursor: pointer; padding: 0 0 13px; display: flex; align-items: center; gap: 3px; }
    .back:hover { color: var(--txt); }

    /* ── Quiz ── */
    .quiz-meta { display: flex; justify-content: space-between; align-items: center; font-size: 0.78rem; color: #777; margin-bottom: 11px; }
    .cat-badge { background: var(--ac); color: #fff; font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; }
    .mode-badge { font-size: 0.65rem; padding: 2px 8px; border-radius: 20px; color: #fff; }
    .timer { font-size: 1rem; font-weight: bold; color: #00e5ff; font-variant-numeric: tabular-nums; min-width: 56px; text-align: right; }
    .dots { display: flex; gap: 4px; flex-wrap: wrap; margin-bottom: 14px; }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #252545; }
    .dot.ok { background: #4caf50; }
    .dot.ng { background: #ef5350; }
    .dot.cur { background: #00e5ff; animation: pulse 1s infinite; }
    @keyframes pulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .qword { font-size: 1.5rem; font-weight: bold; text-align: center; margin-bottom: 5px; color: #fff; line-height: 1.3; word-break: break-all; }
    body[data-fs="large"] .qword { font-size: 2.1rem; }
    .qhint { text-align: center; font-size: 0.75rem; color: #444; margin-bottom: 18px; }
    .choices { display: grid; gap: 8px; margin-bottom: 10px; }
    .ch {
      background: var(--card2); border: 2px solid transparent;
      border-radius: 11px; padding: 13px 8px;
      font-size: 0.9rem; cursor: pointer; transition: all .12s;
      text-align: center; color: var(--txt);
    }
    .ch:hover:not(:disabled) { border-color: var(--ac); background: var(--card3); }
    .ch.ok { background: #1b5e20; border-color: #4caf50; color: #fff; }
    .ch.ng { background: #7f1d1d; border-color: #ef5350; color: #fff; }
    .ch:disabled { cursor: default; }
    .streak-lbl { text-align: center; font-size: 0.8rem; color: #ff9800; font-weight: bold; min-height: 19px; margin-bottom: 4px; }
    .fb { text-align: center; font-size: 1rem; font-weight: bold; min-height: 24px; margin-bottom: 8px; }
    .fb.ok { color: #4caf50; }
    .fb.ng { color: #ef5350; }

    /* ── Survival ── */
    .surv-hdr { text-align: center; margin-bottom: 14px; }
    .surv-num { font-size: 3.5rem; font-weight: bold; color: #ff9800; line-height: 1; }
    .surv-lbl { font-size: 0.78rem; color: var(--txt2); margin-top: 3px; }
    .surv-best-lbl { font-size: 0.75rem; color: #555; margin-top: 2px; }

    /* ── Time Attack ── */
    .ta-hdr { text-align: center; margin-bottom: 14px; }
    .time-big { font-size: 4.5rem; font-weight: bold; color: #00e5ff; line-height: 1; font-variant-numeric: tabular-nums; transition: color .3s; }
    .time-big.urgent { color: #ef5350; animation: urgentPulse .4s infinite; }
    @keyframes urgentPulse { 0%,100%{opacity:1}50%{opacity:.3} }
    .ta-score-lbl { font-size: 0.82rem; color: #ff9800; margin-top: 5px; }

    /* ── Result ── */
    .res-center { text-align: center; margin-bottom: 16px; }
    .res-msg { font-size: 0.85rem; color: var(--txt2); margin-bottom: 7px; }
    .res-big { font-size: 3.6rem; font-weight: bold; color: var(--ac); }
    .res-sub { font-size: 2rem; color: #555; }
    .res-stats { display: flex; justify-content: center; gap: 18px; margin: 10px 0; flex-wrap: wrap; }
    .res-stat { text-align: center; }
    .res-stat strong { display: block; font-size: 0.95rem; color: #fff; }
    .res-stat span { font-size: 0.7rem; color: #666; }
    .pb-chip { display: inline-block; background: #0a2a3a; border: 1px solid #00e5ff; color: #00e5ff; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; margin-top: 5px; }

    /* ── Ach toasts ── */
    .ach-toasts { margin: 10px 0 2px; }
    .ach-new-lbl { font-size: 0.68rem; color: #4caf50; font-weight: bold; letter-spacing: 1px; margin-bottom: 5px; }
    .ach-toast {
      display: flex; align-items: center; gap: 10px;
      background: #0a1c0a; border: 1px solid #4caf50;
      border-radius: 11px; padding: 8px 12px; margin-bottom: 6px;
      animation: sIn .3s ease;
    }
    @keyframes sIn { from{opacity:0;transform:translateY(-7px)}to{opacity:1;transform:none} }
    .at-icon { font-size: 1.6rem; min-width: 34px; text-align: center; }
    .at-name { font-weight: bold; font-size: 0.85rem; color: #4caf50; }
    .at-desc { font-size: 0.72rem; color: var(--txt2); margin-top: 1px; }

    /* ── Stats ── */
    .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
    .stat-box { background: var(--card2); border-radius: 11px; padding: 13px 10px; text-align: center; }
    .stat-box .sv { font-size: 1.5rem; font-weight: bold; color: var(--ac); }
    .stat-box .sk { font-size: 0.7rem; color: #666; margin-top: 3px; }
    .cat-bars { display: flex; flex-direction: column; gap: 7px; }
    .cbi-top { display: flex; justify-content: space-between; font-size: 0.78rem; margin-bottom: 3px; }
    .cbi-pct { color: var(--txt2); }
    .cbi-track { background: var(--card2); border-radius: 20px; height: 6px; overflow: hidden; }
    .cbi-fill { height: 100%; border-radius: 20px; transition: width .4s; }
    .pb-list { display: flex; flex-direction: column; gap: 5px; }
    .pb-item { display: flex; justify-content: space-between; align-items: center; background: var(--card2); border-radius: 9px; padding: 9px 12px; }
    .pb-item .pbl { font-size: 0.82rem; color: var(--txt2); }
    .pb-item .pbv { font-size: 0.9rem; font-weight: bold; color: #00e5ff; }
    .pb-item .pbs { font-size: 0.72rem; color: #666; }

    /* ── Achievements ── */
    .ach-hdr { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    .ach-prog { font-size: 0.75rem; color: var(--txt2); }
    .ach-cat-title { font-size: 0.68rem; color: #555; letter-spacing: 1px; text-transform: uppercase; margin: 13px 0 6px; }
    .ach-grid { display: flex; flex-direction: column; gap: 6px; }
    .ach-item { display: flex; align-items: center; gap: 11px; background: var(--card2); border-radius: 11px; padding: 10px 12px; }
    .ach-item.lk { opacity: .2; filter: grayscale(1); }
    .ai-icon { font-size: 1.75rem; min-width: 34px; text-align: center; }
    .ai-name { font-weight: bold; font-size: 0.85rem; }
    .ai-desc { font-size: 0.72rem; color: var(--txt2); margin-top: 2px; }
    .ai-date { font-size: 0.68rem; color: #4caf50; margin-top: 2px; }

    /* ── Settings ── */
    .set-section { background: var(--card2); border-radius: 12px; padding: 2px 14px; margin-bottom: 12px; }
    .set-row {
      display: flex; align-items: center; justify-content: space-between;
      padding: 13px 0; border-bottom: 1px solid var(--card3);
    }
    .set-row:last-child { border-bottom: none; }
    .set-name { font-size: 0.9rem; font-weight: 500; }
    .set-desc { font-size: 0.7rem; color: #666; margin-top: 2px; }
    .tog { position: relative; width: 44px; height: 24px; flex-shrink: 0; cursor: pointer; }
    .tog input { opacity: 0; width: 0; height: 0; position: absolute; }
    .tog-sl {
      position: absolute; inset: 0;
      background: #2a2a4a; border-radius: 24px; transition: .25s;
    }
    .tog-sl:before {
      content: ''; position: absolute;
      width: 18px; height: 18px; left: 3px; top: 3px;
      background: #fff; border-radius: 50%; transition: .25s;
    }
    .tog input:checked ~ .tog-sl { background: var(--ac); }
    .tog input:checked ~ .tog-sl:before { transform: translateX(20px); }
    .seg { display: flex; gap: 4px; }
    .seg-btn {
      padding: 6px 13px; background: var(--bg); border: 2px solid transparent;
      border-radius: 8px; color: #666; font-size: 0.82rem; cursor: pointer; transition: all .15s;
    }
    .seg-btn.on { border-color: var(--ac); color: #fff; background: var(--ac-ghost); }
    .danger-zone { background: #1c0a0a; border: 1px solid #3a1010; border-radius: 12px; padding: 14px; margin-top: 4px; }
    .danger-title { font-size: 0.68rem; color: #7f1d1d; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 10px; }

    /* ── Modal ── */
    .modal-ov {
      position: fixed; inset: 0;
      background: #00000090; backdrop-filter: blur(6px);
      display: flex; align-items: center; justify-content: center;
      z-index: 999; padding: 20px;
      animation: mFade .15s ease;
    }
    @keyframes mFade { from{opacity:0} to{opacity:1} }
    .modal-box {
      background: var(--card); border-radius: 20px;
      padding: 28px 24px; max-width: 320px; width: 100%;
      box-shadow: 0 16px 60px #000000bb;
      animation: mScale .2s ease;
    }
    @keyframes mScale { from{opacity:0;transform:scale(.88)} to{opacity:1;transform:none} }
    .modal-icon { text-align: center; font-size: 2.4rem; margin-bottom: 8px; }
    .modal-q { text-align: center; font-size: 1.3rem; font-weight: bold; color: #fff; margin-bottom: 6px; }
    .modal-msg { text-align: center; font-size: 0.82rem; color: var(--txt2); margin-bottom: 20px; line-height: 1.5; }
    .modal-yes { display: block; width: 100%; padding: 12px; background: var(--ac); color: #fff; border: none; border-radius: 12px; font-size: 0.95rem; font-weight: 600; cursor: pointer; transition: background .15s; }
    .modal-yes:hover { background: var(--ac-dk); }
    .modal-no { display: block; width: 100%; padding: 11px; background: transparent; border: 2px solid #333; color: var(--txt2); border-radius: 12px; font-size: 0.9rem; cursor: pointer; margin-top: 8px; transition: all .15s; }
    .modal-no:hover { border-color: #555; color: var(--txt); }

    /* ── Egg Toast ── */
    .egg-toast {
      position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%) scale(0);
      background: var(--card); border: 2px solid #ff9800;
      border-radius: 18px; padding: 22px 26px; text-align: center;
      z-index: 9999; max-width: 290px; width: 90%;
      box-shadow: 0 8px 40px #00000099;
      animation: eggPop .3s ease forwards;
    }
    @keyframes eggPop {
      0%{opacity:0;transform:translate(-50%,-50%) scale(.6)}
      70%{transform:translate(-50%,-50%) scale(1.08)}
      100%{opacity:1;transform:translate(-50%,-50%) scale(1)}
    }
    .egg-toast.out { animation: eggFade .4s ease forwards; }
    @keyframes eggFade { to{opacity:0;transform:translate(-50%,-50%) scale(.8)} }

    /* ── Ranking ── */
    .rank-list { display: flex; flex-direction: column; gap: 6px; }
    .rank-entry { display: flex; align-items: center; gap: 9px; background: var(--card2); border-radius: 10px; padding: 10px 12px; }
    .rank-entry.me { border: 1px solid var(--ac); background: #1a1020; }
    .rank-pos { font-size: 1.1rem; min-width: 30px; text-align: center; }
    .rank-n { flex: 1; font-weight: bold; font-size: 0.88rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .rank-v { font-size: 0.88rem; color: var(--ac); font-weight: bold; white-space: nowrap; }
    .rank-t { font-size: 0.72rem; color: #555; min-width: 36px; text-align: right; }
    .rank-tabs { display: flex; gap: 6px; margin-bottom: 12px; flex-wrap: wrap; }
    .rank-tab { flex: 1; padding: 8px 6px; background: var(--card2); border: 2px solid transparent; border-radius: 9px; color: var(--txt2); font-size: 0.8rem; cursor: pointer; text-align: center; transition: all .15s; }
    .rank-tab.on { border-color: var(--ac); color: #fff; background: var(--card3); }
    .rank-loading { text-align: center; padding: 30px 0; color: #666; }
    .rank-empty { text-align: center; padding: 24px; color: #555; font-size: 0.85rem; }
    .no-db-banner { background: #1c1c0a; border: 1px solid #3a3010; border-radius: 11px; padding: 14px; text-align: center; font-size: 0.8rem; color: var(--txt2); line-height: 1.6; }
    .no-db-banner code { background: #2a2a1a; padding: 2px 6px; border-radius: 4px; color: #ff9800; font-size: 0.78rem; }
    .submit-chip { display: inline-block; background: #0a2a1a; border: 1px solid #4caf50; color: #4caf50; font-size: 0.72rem; padding: 3px 10px; border-radius: 20px; margin-top: 5px; }

    /* ── Easter ── */
    .easter-bg { text-align: center; padding: 10px 0; }
    @keyframes rainbowText {
      0%{color:var(--ac)}25%{color:#ff9800}50%{color:#4caf50}75%{color:#00e5ff}100%{color:var(--ac)}
    }
    .rainbow { animation: rainbowText 2s linear infinite; font-weight: bold; }

    hr { border: none; border-top: 1px solid #222240; margin: 13px 0; }
    .sec-lbl { font-size: 0.7rem; color: #555; letter-spacing: 1px; text-transform: uppercase; margin-bottom: 8px; }
    .ghost-link { color: var(--bg); cursor: default; font-size: 0.55rem; display: block; line-height: 2.5; transition: color .8s; }
    .ghost-link:hover { color: rgba(120,120,150,.12); }

    /* ── Basement ── */
    @keyframes doorFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-6px)} }
    .basement-doc {
      background:#0d0005; border:1px solid #2a1a2a; border-radius:8px;
      padding:14px; margin:12px 0; font-family:monospace; font-size:0.72rem;
      line-height:2.2; color:#886688; text-align:left;
    }
    .basement-doc .redacted { background:#330033; color:#330033; border-radius:2px; user-select:none; padding:0 6px; }
    .basement-safe { display:flex; gap:12px; justify-content:center; margin:12px 0; }
    .safe-btn {
      width:54px; height:54px; border-radius:50%; border:3px solid transparent;
      cursor:pointer; font-size:1.5rem; transition:all .2s;
      display:flex; align-items:center; justify-content:center; background:transparent;
    }
    .safe-btn:active { transform:scale(.85); }
    .safe-btn.red  { border-color:#7a1010; background:#3a0505; }
    .safe-btn.yel  { border-color:#7a6000; background:#3a3000; }
    .safe-btn.blu  { border-color:#10307a; background:#00103a; }
    .safe-btn.pressed { filter:brightness(2.5); box-shadow:0 0 12px currentColor; }
    .bgraffiti { font-size:0.68rem; color:#441144; line-height:2.5; text-align:left; padding:10px 6px; }
    .b2-doc { background:#050005; border:1px solid #220022; border-radius:8px; padding:14px; margin:12px 0; font-size:0.7rem; color:#551155; line-height:2.3; text-align:left; }
    .b2-redact { background:#110011; color:#110011; border-radius:2px; padding:0 5px; }
    .zero-room { background:#050505; border:1px solid #1a1a1a; border-radius:14px; padding:30px 20px; text-align:center; min-height:50vh; display:flex; flex-direction:column; align-items:center; justify-content:center; }

    /* ── Glitch & FX ── */
    @keyframes glitch1 { 0%,100%{clip-path:inset(0 0 90% 0)} 20%{clip-path:inset(30% 0 60% 0)} 40%{clip-path:inset(60% 0 30% 0)} 60%{clip-path:inset(0 0 90% 0)} }
    @keyframes glitch2 { 0%,100%{clip-path:inset(60% 0 0 0)} 20%{clip-path:inset(0 0 80% 0)} 40%{clip-path:inset(80% 0 0 0)} }
    .glitch-wrap { position:relative; display:inline-block; }
    .glitch-wrap::before, .glitch-wrap::after { content:attr(data-text); position:absolute; left:0; top:0; width:100%; }
    .glitch-wrap::before { color:#0ff; animation:glitch1 3s infinite; transform:translateX(-2px); }
    .glitch-wrap::after  { color:#f0f; animation:glitch2 3s infinite; transform:translateX(2px); }
    @keyframes starFloat { 0%{opacity:0;transform:translateY(20px) scale(0)} 50%{opacity:1} 100%{opacity:0;transform:translateY(-30px) scale(1.5)} }
    .star-particle { position:fixed; pointer-events:none; animation:starFloat 2s ease-out forwards; font-size:1rem; z-index:9998; }
    @keyframes scanline { 0%{transform:translateY(-100%)} 100%{transform:translateY(100vh)} }
    .radio-bg { background:linear-gradient(180deg,#001200 0%,#000a00 100%); border:1px solid #003300; border-radius:14px; padding:20px; }
    .radio-screen { background:#000800; border:2px solid #00aa00; border-radius:6px; padding:14px; font-family:'Courier New',monospace; font-size:0.72rem; color:#00dd00; line-height:2; margin:10px 0; position:relative; overflow:hidden; max-height:300px; overflow-y:auto; }
    .radio-screen::after { content:''; position:absolute; top:0; left:0; right:0; height:2px; background:rgba(0,200,0,.3); animation:scanline 4s linear infinite; }

function getRank(n)      { let r=RANKS[0]; for(const x of RANKS) if(n>=x.min) r=x; return r; }

const shuffle = a => [...a].sort(()=>Math.random()-.5);
const esc = s => String(s).replace(/\\/g,'\\\\').replace(/'/g,"\\'");
function fmtT(s) {
  return `${Math.floor(s/60).toString().padStart(2,'0')}:${(s%60).toString().padStart(2,'0')}`;
}
function getChoices(q, all) {
  const n = getSettings().choices===2 ? 1 : 3;
  return shuffle([q, ...shuffle(all.filter(v=>v.meaning!==q.meaning)).slice(0,n)]);
}
function buildChoices(q) {
  if(G.mode==='hard'){
    const wrong=shuffle(vocab.filter(v=>v.meaning!==q.meaning)).slice(0,5);
    return shuffle([q,...wrong]);
  }
  if(G.mode==='joke'){
    const realWrong=shuffle(vocab.filter(v=>v.meaning!==q.meaning)).slice(0,1);
    const jokeWrong=shuffle(JOKE_MEANINGS).slice(0,2).map(m=>({word:'???',meaning:m,category:'？'}));
    return shuffle([q,...realWrong,...jokeWrong]);
  }
  return getChoices(q, vocab);
}
function getFilteredVocab() {
  const cats = getSettings().cats || [];
  const filtered = cats.length ? vocab.filter(v => cats.includes(v.category)) : vocab;
  return filtered.length >= 2 ? filtered : vocab;
}
function buildQs(num) {
  const pool = getFilteredVocab();
  return shuffle(pool).slice(0, Math.min(num, pool.length)).map(q=>({q, ch:buildChoices(q)}));
}

function checkAchs(isSurv, mode) {
  const st=getStats(), h=new Date().getHours(), dow=new Date().getDay();
  mode = mode || G.mode;
  const nl=[];
  const mu=(id,cond)=>{ if(cond&&unlockAch(id)) nl.push(id); };

  // 共通
  mu('p5',  st.plays>=5);   mu('p20',  st.plays>=20);  mu('p50',  st.plays>=50);
  mu('p100',st.plays>=100); mu('p200', st.plays>=200); mu('p500', st.plays>=500);
  mu('r50', st.correct>=50); mu('r200',st.correct>=200); mu('r500', st.correct>=500);
  mu('r1000',st.correct>=1000); mu('r2500',st.correct>=2500);
  mu('r5000',st.correct>=5000); mu('r10000',st.correct>=10000);
  mu('night',h>=0&&h<5); mu('morning',h>=5&&h<7); mu('noon',h===12);
  mu('early4',h===4); mu('late2',h===2);
  mu('friday',dow===5); mu('weekend',dow===0||dow===6);
  mu('day3',(st.dayStreak||0)>=3); mu('day7',(st.dayStreak||0)>=7);
  mu('first', true);

  // 実績コレクター
  const unlockedCount = Object.keys(getUnlocked()).length;
  mu('ach10',unlockedCount>=10); mu('ach25',unlockedCount>=25); mu('ach50',unlockedCount>=50);
  const normalAchIds = ACHS.filter(a=>!a.cat.includes('隠し')).map(a=>a.id);
  mu('ach_all', normalAchIds.every(id=>getUnlocked()[id]));

  // 全モード制覇
  const mp = st.modePlays||{};
  mu('all_modes',['normal','reverse','hard','joke','surv','time'].every(m=>mp[m]>0));

  if(mode==='time'){
    mu('ta_10',G.taScore>=10); mu('ta_5',G.taScore>=5); mu('ta_15',G.taScore>=15);
    mu('ta_20',G.taScore>=20); mu('ta_25',G.taScore>=25); mu('ta_30',G.taScore>=30);
    mu('ta_acc',G.taTotal>=10&&G.taScore/G.taTotal>=0.9);
    return nl;
  }

  mu('s3',G.maxStreak>=3); mu('s5',G.maxStreak>=5); mu('s10',G.maxStreak>=10);
  mu('s15',G.maxStreak>=15); mu('s20',G.maxStreak>=20);

  if(isSurv){
    mu('sv5',G.survStreak>=5); mu('sv10',G.survStreak>=10);
    mu('sv15',G.survStreak>=15); mu('sv20',G.survStreak>=20);
    mu('sv30',G.survStreak>=30);
    mu('sv_all',G.survStreak>=vocab.length);
    mu('sv_die1',G.survStreak===0);
  } else {
    const cor=G.res.filter(Boolean).length, tot=G.res.length, sec=G.elapsedSec;
    const cfg=getSettings();
    mu('perfect',cor===tot); mu('god',cor===tot&&tot===vocab.length);
    mu('all_q',tot===vocab.length); mu('max_q',tot===vocab.length);
    mu('s_all',G.maxStreak===tot&&tot>=10);
    mu('sp5',tot>=10&&sec/tot<=5); mu('sp3',tot>=10&&sec/tot<=3);
    mu('sp2',tot>=10&&sec/tot<=2);
    mu('sp30',tot>=10&&sec<=30); mu('sp20',tot>=10&&sec<=20);
    mu('slow',tot>=10&&sec>=180); mu('zero',tot>=5&&cor===0);
    mu('two_perf',cfg.choices===2&&cor===tot&&tot>=5);
    mu('almost',tot>=5&&cor===tot-1);
    mu('one_wrong',tot>=10&&cor===tot-1);
    const best=st.best[tot];
    if(!best||cor>best.score||(cor===best.score&&sec<best.time)) mu('pb',!!best);
    if(mode==='reverse')  { mu('rev_first',true); mu('rev_perf',cor===tot); }
    if(mode==='hard')     { mu('hard_done',true); mu('hard_perf',cor===tot); }
    if(mode==='joke')     { mu('joke_play',true); mu('joke_perf',cor===tot); }
    // 語彙マスター
    const qi=G.qs;
    qi.forEach(({q},i)=>{
      if(G.res[i]){
        if(q.word==='079')   mu('know_079',true);
        if(q.word==='ヌビ二') mu('know_nubbi',true);
      }
    });
    const foodIdxs=qi.reduce((a,{q},i)=>q.category==='食べ物'?[...a,i]:a,[]);
    if(foodIdxs.length>0&&foodIdxs.every(i=>G.res[i])) mu('know_food',true);
    const catsDone=new Set(qi.map(({q},i)=>G.res[i]?q.category:null).filter(Boolean));
    mu('know_all_cat',Object.keys(CAT_COLORS).every(c=>catsDone.has(c)));
  }
  return nl;
}

function _trackDay(st) {
  const today = new Date().toDateString();
  if(st.lastPlayDay !== today) {
    const yesterday = new Date(Date.now()-86400000).toDateString();
    st.dayStreak = (st.lastPlayDay === yesterday) ? (st.dayStreak||0)+1 : 1;
    st.lastPlayDay = today;
  }
}
function updateStats(isSurv) {
  const st=getStats(), cor=G.res.filter(Boolean).length, tot=G.res.length;
  st.plays++; st.correct+=cor; st.questions+=tot;
  st.totalPlaySec=(st.totalPlaySec||0)+G.elapsedSec;
  st.maxStreak=Math.max(st.maxStreak, G.maxStreak);
  st.modePlays = st.modePlays||{};
  st.modePlays[G.mode] = (st.modePlays[G.mode]||0)+1;
  _trackDay(st);
  if(isSurv){
    st.survivalPlays++;
    st.survivalBest=Math.max(st.survivalBest||0, G.survStreak);
  } else {
    G.qs.forEach(({q},i)=>{
      st.catCorrect[q.category]=(st.catCorrect[q.category]||0)+(G.res[i]?1:0);
      st.catTotal[q.category]=(st.catTotal[q.category]||0)+1;
    });
    const prev=st.best[tot];
    if(!prev||cor>prev.score||(cor===prev.score&&G.elapsedSec<prev.time))
      st.best[tot]={score:cor, time:G.elapsedSec};
  }
  saveStats(st);
}
function updateStatsTA() {
  const st=getStats();
  st.plays++; st.correct+=G.taScore; st.questions+=G.taTotal;
  st.totalPlaySec=(st.totalPlaySec||0)+60;
  st.taPlays = (st.taPlays||0)+1;
  st.modePlays = st.modePlays||{}; st.modePlays['time']=(st.modePlays['time']||0)+1;
  if(G.taScore>(st.taBest||0)) st.taBest=G.taScore;
  _trackDay(st);
  saveStats(st);
}

async function submitScore(tab, data) {
  if(!SUPABASE_URL || !SUPABASE_KEY) return;
  try {

      method: 'POST',
      headers: { ..._SB_HDR(), 'Prefer': 'return=minimal' },

    });

async function fetchRankings(tab) {
  if(!SUPABASE_URL || !SUPABASE_KEY) return [];
  try {
    const order = tab==='surv' ? 'streak.desc,time.asc'
                : tab==='time' ? 'ta_score.desc'
                :                'pct.desc,time.asc';
    const res = await fetch(
      `${SUPABASE_URL}/rest/v1/scores?select=*&tab=eq.${tab}&order=${order}&limit=300`,
      { headers: _SB_HDR() }
    );
    const data = await res.json();
    if(!Array.isArray(data)) return [];

    // 名前ごとに最高スコアだけ残す
    const best = {};
    for(const e of data) {
      const key = (e.name||'名無し').trim().toLowerCase();
      if(!best[key]) { best[key]=e; continue; }
      const cur = best[key];
      let better = false;
      if(tab==='surv')      better = (e.streak||0)>(cur.streak||0) || ((e.streak||0)===(cur.streak||0)&&(e.time||9999)<(cur.time||9999));
      else if(tab==='time') better = (e.ta_score||0)>(cur.ta_score||0);
      else                  better = (e.pct||0)>(cur.pct||0) || ((e.pct||0)===(cur.pct||0)&&(e.time||9999)<(cur.time||9999));
      if(better) best[key]=e;
    }
    return Object.values(best);
  } catch(e) { return []; }
}

async function goRanking() {
  G.screen = 'ranking';
  _rankTab = G.mode==='surv' ? 'surv' : G.mode==='time' ? 'time' : (G.mode||'normal');

// ─── START ──────────────────────────────
function startGame(isRetry=false) {
  if(isRetry) {
    _retryCount++;
    if(_retryCount>=5)  triggerEgg('egg_retry','🔄','もう一度中毒','やめられない止まらない笑🔄');
    if(_retryCount>=10) triggerEgg('egg_result_rage','😤','リトライ魔','もう一度を10回以上押した😤');
  } else {
    _retryCount=0;
  }
  clearInterval(G.timerInt);
  clearInterval(G.taTimerInt);
  G.res=[]; G.answered=false; G.streak=0; G.maxStreak=0;
  G.elapsedSec=0; G.newlyUnlocked=[]; G.startTime=Date.now();

  if(G.mode==='surv'){
    G.survQueue=shuffle([...vocab]).map(q=>({q,ch:getChoices(q,vocab)}));
    G.survStreak=0; G.survConsecWrong=0;
    G.screen='surv'; render();
    G.timerInt=setInterval(()=>{
      G.elapsedSec=Math.floor((Date.now()-G.startTime)/1000);
      const el=document.getElementById('timer');
      if(el) el.textContent=getSettings().timer?'⏱ '+fmtT(G.elapsedSec):'';
    },500);
  } else if(G.mode==='time'){
    G.taScore=0; G.taTotal=0; G.timeLeft=60; G.answered=false;
    G.taQueue=shuffle([...vocab]).map(q=>({q,ch:getChoices(q,vocab)}));
    G.screen='time'; render();
    G.taTimerInt=setInterval(()=>{
      G.timeLeft=Math.max(0,G.timeLeft-1);
      const el=document.getElementById('ta-timer');
      if(el){ el.textContent=G.timeLeft; el.className='time-big'+(G.timeLeft<=10?' urgent':''); }
      if(G.timeLeft<=0){ clearInterval(G.taTimerInt); endTimeAttack(); }
    },1000);
  } else {
    G.qs=buildQs(G.selNum); G.cur=0;
    G.screen='quiz'; render();
    G.timerInt=setInterval(()=>{
      G.elapsedSec=Math.floor((Date.now()-G.startTime)/1000);
      const el=document.getElementById('timer');
      if(el) el.textContent=getSettings().timer?'⏱ '+fmtT(G.elapsedSec):'';
    },500);
  }
}

// ─── QUIZ ───────────────────────────────
function quizHTML() {
  const cfg=getSettings();
  const {q,ch}=G.qs[G.cur];
  const isReverse=G.mode==='reverse';
  const qDisplay  = isReverse ? q.meaning : q.word;
  const hint      = isReverse ? 'の隠語は？' : G.mode==='joke' ? 'は？ (ちょっとカオスな選択肢あり🤪)' : 'は？';
  const choiceKey = isReverse ? 'word' : 'meaning';
  const correctVal= isReverse ? q.word  : q.meaning;

  const dots=G.qs.map((_,i)=>{
    if(i<G.res.length) return `<div class="dot ${G.res[i]?'ok':'ng'}"></div>`;
    if(i===G.cur)      return `<div class="dot cur"></div>`;
    return `<div class="dot"></div>`;
  }).join('');

  const modeColors = {reverse:'#2196f3',hard:'#e91e63',joke:'#ff9800',normal:'var(--ac)'};
  const modeLabels = {reverse:'🔄逆クイズ',hard:'💀ハード6択',joke:'🤪ネタ',normal:''};
  const modeBadge  = modeLabels[G.mode]
    ? `<span class="mode-badge" style="background:${modeColors[G.mode]}">${modeLabels[G.mode]}</span>`
    : '';

  const cols=ch.length===2?'1fr':'1fr 1fr';
  return `
    <div class="quiz-meta">
      <span>${G.cur+1} / ${G.qs.length}</span>
      <span style="display:flex;gap:5px;align-items:center">
        ${cfg.catBadge?`<span class="cat-badge">${q.category}</span>`:''}
        ${modeBadge}
      </span>
      <span class="timer" id="timer">${cfg.timer?'⏱ '+fmtT(G.elapsedSec):''}</span>
    </div>
    <div class="dots">${dots}</div>
    <div class="qword">${qDisplay}</div>
    <div class="qhint">${hint}</div>
    <div class="choices" style="grid-template-columns:${cols}">
      ${ch.map((c,i)=>`<button class="ch" id="c${i}" onclick="answerQ(${i},'${esc(c[choiceKey])}','${esc(correctVal)}')">${i+1}. ${c[choiceKey]}</button>`).join('')}
    </div>
    <div class="streak-lbl" id="slbl">${cfg.streak&&G.streak>=3?getStreakCheer(G.streak):''}</div>
    <div class="fb" id="fb"></div>
    <button class="btn" id="nxt" onclick="nextQ()" disabled>${G.cur+1<G.qs.length?'次へ →':'結果を見る'}</button>
  `;
}

function getStreakCheer(n) {
  let msg = '🔥 '+n+'連続正解中！';
  for(const k of Object.keys(STREAK_CHEERS).map(Number).sort((a,b)=>b-a))
    if(n>=k){ msg=STREAK_CHEERS[k].replace(/\d+/,n); break; }
  return msg;
}

function answerQ(idx,sel,correct) {
  if(G.answered) return;
  showConfirm(`「${sel}」を選びますか？`, ()=>doAnswerQ(idx,sel,correct));
}
function doAnswerQ(idx,sel,correct) {
  if(G.answered) return;
  G.answered=true;
  const ok=sel===correct;
  G.res.push(ok);
  if(ok){ G.streak++; G.maxStreak=Math.max(G.maxStreak,G.streak); } else G.streak=0;
  document.querySelectorAll('.ch').forEach((b,i)=>{
    b.disabled=true;
    const m=b.textContent.replace(/^\d+\.\s*/,'');
    if(m===correct) b.classList.add('ok');
    else if(i===idx&&!ok) b.classList.add('ng');
  });
  const fb=document.getElementById('fb');
  if(ok){
    const msgs = G.mode==='joke' ? ['⭕ 正解！騙されなかった！','⭕ ネタに釣られなかった！','⭕ 天才！','⭕ そう！カオスの中から正解！'] :
                 G.mode==='hard' ? ['⭕ 6択から正解！さすが！','⭕ ハードをクリア！天才！','⭕ 正解！難しいのに！','⭕ すごい、ちゃんと覚えてる！'] :
                 ['⭕ 正解！','⭕ 天才！','⭕ さすが！','⭕ よっしゃ！','⭕ 完璧！','⭕ わかってる！'];
    fb.textContent=msgs[Math.floor(Math.random()*msgs.length)];
    fb.className='fb ok';
  } else {
    const cfg2=getSettings();
    const tauntMsg=cfg2.taunt?TAUNT_MSGS[Math.floor(Math.random()*TAUNT_MSGS.length)]:'不正解…';
    fb.innerHTML=`❌ ${tauntMsg}<br><small style="font-weight:normal">正解は「${correct}」</small>`;
    fb.className='fb ng';
  }
  const sl=document.getElementById('slbl');
  if(sl) sl.textContent=getSettings().streak&&G.streak>=3?getStreakCheer(G.streak):'';
  const nxtBtn=document.getElementById('nxt');
  nxtBtn.disabled=false;
  if(ok && getSettings().autoNext) setTimeout(()=>{ const b=document.getElementById('nxt'); if(b&&!b.disabled) b.click(); },700);
}

function nextQ() {
  G.answered=false; G.cur++;
  if(G.cur>=G.qs.length){
    clearInterval(G.timerInt);
    G.elapsedSec=Math.floor((Date.now()-G.startTime)/1000);
    _rareEventFired=false;
    updateStats(false); G.newlyUnlocked=checkAchs(false); G.screen='result';
    const cor=G.res.filter(Boolean).length, tot=G.res.length;
    submitScore(G.mode||'normal',{score:cor,total:tot,pct:Math.round(cor/tot*100),time:G.elapsedSec});
    checkEggAtResult();
    if(cor*2===tot && tot>=4) triggerEgg('egg_half','🎯','ジャスト半分','ちょうど50%！奇跡の真ん中🎯');
    const pct2=Math.round(cor/tot*100);
    if(pct2===79) triggerEgg('egg_79pct','🧮','79パーセント','ちょうど79%！おならの数字w🧮');
    if(cor===7&&tot>7&&tot!==10) triggerEgg('egg_exact7','7️⃣','ラッキー7','ちょうど7問正解！ラッキーセブン🎰');
    if(cor===7&&tot===10) triggerEgg('egg_777','🎰','トリプルセブン','7/10のトリプルセブン！🎰');
    if(tot===1) triggerEgg('egg_1q','1️⃣','1問勝負','たった1問で勝負！漢だ1️⃣');
  } else {
    G.screen='quiz';
    if(!_rareEventFired && Math.random()<0.015) {
      _rareEventFired=true;
      triggerEgg('egg_rare','⚡','レアイベント目撃者','クイズ中に極稀なイベントが発生⚡');
      document.getElementById('card').classList.add('rare-glitch');
      setTimeout(()=>document.getElementById('card')?.classList.remove('rare-glitch'),600);
    }
  }
  render();
}

function rankingHTML() {
  const tabs = [
    {id:'normal',  label:'📝 通常'},
    {id:'reverse', label:'🔄 逆'},
    {id:'hard',    label:'💀 ハード'},
    {id:'joke',    label:'🤪 ネタ'},
    {id:'surv',    label:'⚔️ サバイバル'},
    {id:'time',    label:'⏰ タイムアタック'},
  ];
  const tabsHTML = tabs.map(t=>
    `<div class="rank-tab${_rankTab===t.id?' on':''}" onclick="switchRankTab('${t.id}')">${t.label}</div>`
  ).join('');

  let content = '';
  if(!SUPABASE_URL || !SUPABASE_KEY) {
    content = `<div class="no-db-banner">
      ⚙️ Supabaseの設定がまだです。<br>
      quiz.html の <code>SUPABASE_URL</code> と<br>
      <code>SUPABASE_KEY</code> を貼り付けてください。
    </div>`;
  } else if(_rankLoading || !_rankData[_rankTab]) {
    content = `<div class="rank-loading">
      <div style="font-size:2rem;animation:pulse 1s infinite">⏳</div>
      <div style="margin-top:8px">読み込み中...</div>
    </div>`;
  } else {
    const entries = _rankData[_rankTab] || [];
    let sorted;
    if(_rankTab==='surv')
      sorted = [...entries].sort((a,b)=>(b.streak||0)-(a.streak||0)||((a.time||9999)-(b.time||9999)));
    else if(_rankTab==='time')
      sorted = [...entries].sort((a,b)=>(b.ta_score||0)-(a.ta_score||0));
    else
      sorted = [...entries].sort((a,b)=>(b.pct||0)-(a.pct||0)||((a.time||9999)-(b.time||9999)));
    sorted = sorted.slice(0,20);

    if(sorted.length===0){
      content = `<div class="rank-empty">まだランキングがありません🙂<br>プレイしてスコアを登録しよう！</div>`;
    } else {
      const medals=['🥇','🥈','🥉'];
      const myName=(G.name||'名無し').trim().toLowerCase();
      content = `<div class="rank-list">`+sorted.map((e,i)=>{
        const isMe=(e.name||'名無し').trim().toLowerCase()===myName;
        let val, sub='';
        if(_rankTab==='surv'){
          val=(e.streak||0)+'連続'; sub=fmtT(e.time||0);
        } else if(_rankTab==='time'){
          val=(e.ta_score||0)+'問';
        } else {
          val=(e.score||0)+'/'+(e.total||0)+' '+(e.pct||0)+'%'; sub=fmtT(e.time||0);
        }
        return `<div class="rank-entry${isMe?' me':''}">
          <span class="rank-pos">${medals[i]||'#'+(i+1)}</span>
          <span class="rank-n">${esc(e.name||'名無し')}${isMe?' 👈':''}</span>
          <span class="rank-v">${val}</span>
          <span class="rank-t">${sub}</span>
        </div>`;
      }).join('')+'</div>';
    }
  }

  return `
    <button class="back" onclick="goHome()">← 戻る</button>
    <div style="font-size:1.05rem;font-weight:bold;margin-bottom:12px">🏆 オンラインランキング</div>
    <div class="rank-tabs">${tabsHTML}</div>
    ${content}
    <button class="btn sec" style="margin-top:14px" onclick="switchRankTab('${_rankTab}')">🔄 更新</button>
    <div onclick="triggerEgg('egg_rank_ghost','🏅','ランキングの亡霊','ランキングに隠れた幽霊を発見！👻')" class="ghost-link" style="text-align:right">このランキングは本物</div>
  `;
}

// ── スマホ: スワイプでコナミ ──
(()=>{
  const SWIPE_DIRS = ['up','up','down','down','left','right','left','right'];
  let _swipeSeq = [], _swipeVSeq = [];
  let _tx0 = 0, _ty0 = 0;
  document.addEventListener('touchstart', e => {
    _tx0 = e.touches[0].clientX;
    _ty0 = e.touches[0].clientY;
  }, {passive:true});
  document.addEventListener('touchend', e => {
    const dx = e.changedTouches[0].clientX - _tx0;
    const dy = e.changedTouches[0].clientY - _ty0;
    if(Math.abs(dx) < 30 && Math.abs(dy) < 30) return; // タップはスキップ
    let dir;
    if(Math.abs(dx) > Math.abs(dy)) dir = dx > 0 ? 'right' : 'left';
    else dir = dy > 0 ? 'down' : 'up';
    _swipeSeq.push(dir);
    if(_swipeSeq.length > SWIPE_DIRS.length) _swipeSeq.shift();
    if(_swipeSeq.join() === SWIPE_DIRS.join())
      triggerEgg('egg_konami','🕹️','コナミの使徒','スワイプでコナミ入力！？天才すぎる🕹️');
    // 下→上→下で画面反転
    _swipeVSeq.push(dir); if(_swipeVSeq.length>3) _swipeVSeq.shift();
    if(_swipeVSeq.join(',') === 'down,up,down') {
      _swipeVSeq=[];
      document.body.style.filter='invert(1)';
      setTimeout(()=>document.body.style.filter='', 1000);
      triggerEgg('egg_invert','🙃','世界の裏側','下上下スワイプで世界が反転！🙃');
    }
  }, {passive:true});
})();

// ── スマホ: シェイクでpizza ──
(()=>{
  let _lastShake = 0, _shakeCnt = 0;
  const onMotion = e => {
    const a = e.accelerationIncludingGravity;
    if(!a) return;
    const force = Math.abs(a.x||0) + Math.abs(a.y||0) + Math.abs(a.z||0);
    if(force > 40) {
      const now = Date.now();
      if(now - _lastShake < 1200) {
        _shakeCnt++;
        if(_shakeCnt >= 3) {
          _shakeCnt = 0;
          triggerEgg('egg_type','⌨️','pizza職人','スマホを振ってpizza召喚！🍕🍕🍕');
        }
      } else {
        _shakeCnt = 1;
      }
      _lastShake = now;
    }
  };
  if(typeof DeviceMotionEvent !== 'undefined') {
    if(typeof DeviceMotionEvent.requestPermission === 'function') {
      // iOS 13+ は初回タップ後に許可要求
      document.addEventListener('click', ()=>{
        DeviceMotionEvent.requestPermission().then(s=>{
          if(s==='granted') window.addEventListener('devicemotion', onMotion);
        }).catch(()=>{});
      }, {once:true});
    } else {
      window.addEventListener('devicemotion', onMotion);
    }
  }
})();

render();
</script>
</body>
